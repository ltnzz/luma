<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('luma-theme')
          const resolvedTheme =
            savedTheme === 'dark' || savedTheme === 'light'
              ? savedTheme
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolvedTheme
          document.documentElement.style.colorScheme = resolvedTheme

          const savedLanguage = localStorage.getItem('luma-language')
          if (savedLanguage === 'id' || savedLanguage === 'en') {
            document.documentElement.lang = savedLanguage
          }
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Luma — Platform peta cerdas, indikator keberlanjutan, dan pemantauan fasilitas publik DKI Jakarta." />
    <link rel="preload" as="image" href="/luma-logo.png" type="image/png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Luma — Dashboard DKI Jakarta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
